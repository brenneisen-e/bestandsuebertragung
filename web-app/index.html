<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestandsübertragung - ERGO Maklertool</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="8" fill="#C8102E"/>
                    <text x="20" y="26" text-anchor="middle" fill="white" font-size="16" font-weight="bold">BÜ</text>
                </svg>
            </div>
            <h1>Bestandsübertragung</h1>
        </div>
        <div class="header-actions">
            <label class="btn btn-secondary" id="importBtn">
                <span class="icon">↓</span> JSON Import
                <input type="file" id="fileInput" accept=".json" hidden>
            </label>
            <button class="btn btn-secondary" id="exportCsvBtn">
                <span class="icon">↑</span> CSV Export
            </button>
            <button class="btn btn-outline" id="resetDemoBtn">
                <span class="icon">⟳</span> Demo Reset
            </button>
        </div>
    </header>

    <!-- Warnbereich für nicht zugeordnete Mails -->
    <section class="warning-section" id="warningSection" style="display: none;">
        <div class="warning-header">
            <span class="warning-icon">△</span>
            <span class="warning-title">Nicht zugeordnete Mails</span>
            <span class="warning-count" id="warningCount">0</span>
        </div>
        <div class="unassigned-mails" id="unassignedMails"></div>
    </section>

    <!-- Filter-Bereich -->
    <section class="filter-section">
        <div class="filter-row">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" id="searchInput" placeholder="Suche nach Kunde, VS-Nr, Versicherer...">
            </div>
            <div class="filter-group">
                <select id="filterStatus">
                    <option value="">Alle Status</option>
                    <option value="neu">○ Neu</option>
                    <option value="angefragt">◐ Angefragt</option>
                    <option value="in-bearbeitung">◑ In Bearbeitung</option>
                    <option value="bestaetigt">● Bestätigt</option>
                    <option value="abgelehnt">✕ Abgelehnt</option>
                    <option value="erledigt">✔ Erledigt</option>
                </select>
                <select id="filterVersicherer">
                    <option value="">Alle Versicherer</option>
                </select>
                <select id="filterSparte">
                    <option value="">Alle Sparten</option>
                    <option value="KFZ">KFZ</option>
                    <option value="Leben">Leben</option>
                    <option value="Kranken">Kranken</option>
                    <option value="Haftpflicht">Haftpflicht</option>
                    <option value="Hausrat">Hausrat</option>
                    <option value="Rechtsschutz">Rechtsschutz</option>
                    <option value="Unfall">Unfall</option>
                    <option value="BU">BU</option>
                    <option value="Wohngebäude">Wohngebäude</option>
                    <option value="Rente">Rente</option>
                </select>
            </div>
        </div>
        <div class="filter-row filter-checkboxes">
            <label class="checkbox-label">
                <input type="checkbox" id="filterFlagged">
                <span class="checkmark"></span>
                <span class="icon">⚑</span> Nur geflaggte
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="filterOpen">
                <span class="checkmark"></span>
                Nur offene
            </label>
        </div>
    </section>

    <!-- Statistik-Bereich -->
    <section class="stats-section">
        <div class="stat-item">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">Gesamt</span>
        </div>
        <div class="stat-item stat-neu">
            <span class="stat-value" id="statNeu">0</span>
            <span class="stat-label">○ Neu</span>
        </div>
        <div class="stat-item stat-angefragt">
            <span class="stat-value" id="statAngefragt">0</span>
            <span class="stat-label">◐ Angefragt</span>
        </div>
        <div class="stat-item stat-bearbeitung">
            <span class="stat-value" id="statBearbeitung">0</span>
            <span class="stat-label">◑ In Bearb.</span>
        </div>
        <div class="stat-item stat-bestaetigt">
            <span class="stat-value" id="statBestaetigt">0</span>
            <span class="stat-label">● Bestätigt</span>
        </div>
        <div class="stat-item stat-abgelehnt">
            <span class="stat-value" id="statAbgelehnt">0</span>
            <span class="stat-label">✕ Abgelehnt</span>
        </div>
        <div class="stat-item stat-erledigt">
            <span class="stat-value" id="statErledigt">0</span>
            <span class="stat-label">✔ Erledigt</span>
        </div>
        <div class="stat-item stat-flagged">
            <span class="stat-value" id="statFlagged">0</span>
            <span class="stat-label">⚑ Geflaggt</span>
        </div>
    </section>

    <!-- Vorgangsliste -->
    <section class="cases-section">
        <div class="cases-header">
            <button class="btn btn-primary" id="newCaseBtn">
                <span class="icon">+</span> Neuer Vorgang
            </button>
            <div class="sort-options">
                <label>Sortieren:</label>
                <select id="sortSelect">
                    <option value="updatedAt-desc">Letzte Aktivität ↓</option>
                    <option value="updatedAt-asc">Letzte Aktivität ↑</option>
                    <option value="createdAt-desc">Erstellt ↓</option>
                    <option value="createdAt-asc">Erstellt ↑</option>
                    <option value="kunde-asc">Kunde A-Z</option>
                    <option value="kunde-desc">Kunde Z-A</option>
                </select>
            </div>
        </div>
        <div class="cases-list" id="casesList"></div>
        <div class="cases-empty" id="casesEmpty" style="display: none;">
            <span class="empty-icon">◯</span>
            <p>Keine Vorgänge gefunden</p>
        </div>
    </section>

    <!-- Modal: Vorgang Detail -->
    <div class="modal-overlay" id="caseModal" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Vorgang bearbeiten</h2>
                <button class="modal-close" id="modalClose">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-tabs">
                    <button class="tab-btn active" data-tab="details">Details</button>
                    <button class="tab-btn" data-tab="messages">Mails <span class="tab-count" id="messagesCount">0</span></button>
                    <button class="tab-btn" data-tab="history">Historie</button>
                </div>

                <!-- Tab: Details -->
                <div class="tab-content active" id="tab-details">
                    <form id="caseForm">
                        <input type="hidden" id="caseId">

                        <div class="form-row">
                            <div class="form-group">
                                <label for="caseKunde">Kunde (Nachname, Vorname)</label>
                                <input type="text" id="caseKunde" placeholder="z.B. Müller, Thomas">
                                <div class="confidence-indicator" id="kundeConfidence"></div>
                            </div>
                            <div class="form-group">
                                <label for="caseVsNr">Versicherungsnummer</label>
                                <input type="text" id="caseVsNr" placeholder="z.B. ERG-12345678">
                                <div class="confidence-indicator" id="vsNrConfidence"></div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="caseVersicherer">Versicherer</label>
                                <select id="caseVersicherer">
                                    <option value="">-- Auswählen --</option>
                                    <option value="ERGO">ERGO</option>
                                    <option value="Allianz">Allianz</option>
                                    <option value="AXA">AXA</option>
                                    <option value="HDI">HDI</option>
                                    <option value="Zurich">Zurich</option>
                                    <option value="Generali">Generali</option>
                                    <option value="Debeka">Debeka</option>
                                    <option value="Signal Iduna">Signal Iduna</option>
                                    <option value="HUK-Coburg">HUK-Coburg</option>
                                    <option value="Nürnberger">Nürnberger</option>
                                    <option value="Gothaer">Gothaer</option>
                                    <option value="Barmenia">Barmenia</option>
                                    <option value="R+V">R+V</option>
                                    <option value="LVM">LVM</option>
                                    <option value="DEVK">DEVK</option>
                                    <option value="Continentale">Continentale</option>
                                    <option value="WWK">WWK</option>
                                    <option value="Basler">Basler</option>
                                    <option value="HanseMerkur">HanseMerkur</option>
                                    <option value="INTER">INTER</option>
                                    <option value="Volkswohl Bund">Volkswohl Bund</option>
                                    <option value="Swiss Life">Swiss Life</option>
                                    <option value="Canada Life">Canada Life</option>
                                    <option value="Condor">Condor</option>
                                    <option value="Alte Leipziger">Alte Leipziger</option>
                                    <option value="Hallesche">Hallesche</option>
                                    <option value="Provinzial">Provinzial</option>
                                    <option value="SV SparkassenVersicherung">SV SparkassenVersicherung</option>
                                    <option value="WGV">WGV</option>
                                    <option value="Sonstige">Sonstige</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="caseSparte">Sparte</label>
                                <select id="caseSparte">
                                    <option value="">-- Auswählen --</option>
                                    <option value="KFZ">KFZ</option>
                                    <option value="Leben">Leben</option>
                                    <option value="Kranken">Kranken</option>
                                    <option value="Haftpflicht">Haftpflicht</option>
                                    <option value="Hausrat">Hausrat</option>
                                    <option value="Rechtsschutz">Rechtsschutz</option>
                                    <option value="Unfall">Unfall</option>
                                    <option value="BU">BU</option>
                                    <option value="Wohngebäude">Wohngebäude</option>
                                    <option value="Rente">Rente</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="caseStatus">Status</label>
                                <select id="caseStatus">
                                    <option value="neu">○ Neu</option>
                                    <option value="angefragt">◐ Angefragt</option>
                                    <option value="in-bearbeitung">◑ In Bearbeitung</option>
                                    <option value="bestaetigt">● Bestätigt</option>
                                    <option value="abgelehnt">✕ Abgelehnt</option>
                                    <option value="erledigt">✔ Erledigt</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="caseDatum">Gültigkeitsdatum</label>
                                <input type="text" id="caseDatum" placeholder="TT.MM.JJJJ">
                                <div class="confidence-indicator" id="datumConfidence"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="caseNotes">Notizen</label>
                            <textarea id="caseNotes" rows="3" placeholder="Interne Notizen..."></textarea>
                        </div>

                        <div class="form-group form-checkbox">
                            <label class="checkbox-label">
                                <input type="checkbox" id="caseFlagged">
                                <span class="checkmark"></span>
                                <span class="icon">⚑</span> Als wichtig markieren
                            </label>
                        </div>
                    </form>
                </div>

                <!-- Tab: Mails -->
                <div class="tab-content" id="tab-messages">
                    <div class="messages-timeline" id="messagesTimeline"></div>
                    <div class="messages-empty" id="messagesEmpty">
                        <span class="empty-icon">✉</span>
                        <p>Keine E-Mails vorhanden</p>
                    </div>
                </div>

                <!-- Tab: Historie -->
                <div class="tab-content" id="tab-history">
                    <div class="history-timeline" id="historyTimeline"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="deleteCase">Löschen</button>
                <div class="modal-footer-right">
                    <button class="btn btn-secondary" id="cancelCase">Abbrechen</button>
                    <button class="btn btn-primary" id="saveCase">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Mail zuordnen -->
    <div class="modal-overlay" id="assignModal" style="display: none;">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2>Mail zuordnen</h2>
                <button class="modal-close" id="assignModalClose">×</button>
            </div>
            <div class="modal-body">
                <div class="mail-preview" id="assignMailPreview"></div>
                <div class="form-group">
                    <label>Vorgang auswählen</label>
                    <input type="text" id="assignSearch" placeholder="Suche nach Kunde, VS-Nr...">
                    <div class="assign-results" id="assignResults"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="assignCancel">Abbrechen</button>
                <button class="btn btn-primary" id="assignConfirm" disabled>Zuordnen</button>
            </div>
        </div>
    </div>

    <!-- Drag & Drop Overlay -->
    <div class="drop-overlay" id="dropOverlay" style="display: none;">
        <div class="drop-content">
            <span class="drop-icon">↓</span>
            <p>JSON-Datei hier ablegen</p>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/extractor.js"></script>
    <script src="js/matcher.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/export.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
<!-- Trigger rebuild -->
